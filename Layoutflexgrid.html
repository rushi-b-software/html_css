
<!DOCTYPE html>
<html>
<head>
<style>

/* BASIC STYLING */
body {
  font-family: Arial;
  margin: 20px;
}

h2 {
  text-align: center;
}

/* FLEXBOX */
.flex-container {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  align-content: center;
  flex-wrap: wrap;
  gap: 20px;
  row-gap: 20px;
  column-gap: 20px;
  height: 300px;
  background-color: lightgray;
}

.flex-box {
  background-color: orange;
  padding: 20px;
  width: 100px;
  height: 80px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.flex-box:first-child {
  order: 2;
  flex-grow: 1;
  flex-shrink: 1;
  flex-basis: 100px;
  align-self: flex-start;
}

/* GRID */
.grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 120px);
  gap: 20px;
  justify-items: center;
  align-items: center;
  justify-content: center;
  align-content: center;
  background-color: lightgray;
  padding: 20px;
}

.grid-box {
  background-color: lightblue;
  width: 100%;
  height: 80px;
  display: grid;
  place-items: center;
}

/* GRID POSITIONING */
.grid-box:first-child {
  grid-column: 1 / 3;
}

.grid-box:nth-child(2) {
  grid-row: 2;
}

/* GRID TEMPLATE AREAS */
.layout {
  display: grid;
  grid-template-columns: 1fr 3fr;
  grid-template-rows: 60px 200px 60px;
  grid-template-areas:
    "header header"
    "sidebar content"
    "footer footer";
  gap: 10px;
}

.header {
  grid-area: header;
  background-color: orange;
}

.sidebar {
  grid-area: sidebar;
  background-color: lightblue;
}

.content {
  grid-area: content;
  background-color: lightgreen;
}

.footer {
  grid-area: footer;
  background-color: lightcoral;
}

/* RESPONSIVE GRID */
.responsive-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.responsive-grid div {
  background-color: lightblue;
  padding: 30px;
  text-align: center;
}

</style>
</head>

<body>

<h2>Flexbox Example</h2>

<div class="flex-container">
  <div class="flex-box">Box 1</div>
  <div class="flex-box">Box 2</div>
  <div class="flex-box">Box 3</div>
</div>

<h2>Grid Example</h2>

<div class="grid-container">
  <div class="grid-box">1</div>
  <div class="grid-box">2</div>
  <div class="grid-box">3</div>
  <div class="grid-box">4</div>
  <div class="grid-box">5</div>
  <div class="grid-box">6</div>
</div>

<h2>Grid Template Areas</h2>

<div class="layout">
  <div class="header">Header</div>
  <div class="sidebar">Sidebar</div>
  <div class="content">Content</div>
  <div class="footer">Footer</div>
</div>

<h2>Responsive Grid</h2>

<div class="responsive-grid">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>
  <div>Item 4</div>
</div>

</body>
</html>
