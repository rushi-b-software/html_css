
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Table Tags</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .page-body {
            margin: 0;
            padding: 20px;
            background-color: #eef2f7;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        .student-table {
            width: 95%;
            min-width: 500px;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0;
            background-color: white;
            color: #222;
            border: 3px solid #222;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            table-layout: auto;
            caption-side: top;
            empty-cells: show;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: normal;
            font-style: normal;
            line-height: 1.5;
            text-align: center;
            vertical-align: middle;
            box-shadow: 0 8px 20px #00000025;
            opacity: 1;
            visibility: visible;
            transition: box-shadow 0.3s ease;
        }

        .student-table:hover {
            box-shadow: 0 12px 28px #00000035;
        }

        .table-head {
            display: table-header-group;
            background-color: #173b70;
            color: white;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 1;
        }

        .table-body {
            display: table-row-group;
            background-color: #ffffff;
            color: #333;
            text-align: center;
            vertical-align: middle;
            font-size: 16px;
            font-weight: normal;
            line-height: 1.6;
        }

        .table-foot {
            display: table-footer-group;
            background-color: #fff0c2;
            color: #743b00;
            text-align: right;
            vertical-align: middle;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
            border-top: 3px solid #b8860b;
        }

        .table-row {
            display: table-row;
            height: 50px;
            min-height: 40px;
            background-color: transparent;
            color: inherit;
            border: 1px solid #ccc;
            vertical-align: middle;
            opacity: 1;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .table-body .table-row:hover {
            background-color: #c9f7d5;
            color: #124d27;
            cursor: pointer;
        }

        .table-heading {
            min-width: 100px;
            max-width: 300px;
            height: 55px;
            padding: 14px;
            background-color: #173b70;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: 700;
            font-style: normal;
            font-variant: normal;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            text-indent: 0;
            letter-spacing: 1px;
            word-spacing: 2px;
            line-height: 1.5;
            border: 1px solid #8da9d0;
            border-bottom: 3px solid #0d2445;
            vertical-align: middle;
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
            text-shadow: 1px 1px 2px #00000055;
            opacity: 1;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .table-heading:hover {
            background-color: #28599a;
        }

        .table-data {
            min-width: 80px;
            max-width: 350px;
            height: 45px;
            padding: 12px;
            background-color: transparent;
            color: #333;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: normal;
            font-style: normal;
            font-variant: normal;
            text-align: center;
            text-decoration: none;
            text-transform: none;
            text-indent: 0;
            letter-spacing: 0.3px;
            word-spacing: 1px;
            line-height: 1.6;
            border: 1px solid #c8d0da;
            border-radius: 2px;
            vertical-align: middle;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: normal;
            opacity: 1;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }

        .table-data:hover {
            background-color: #fff3cd;
            color: #7a4300;
        }

        .table-foot .table-data {
            background-color: #fff0c2;
            color: #743b00;
            font-weight: bold;
            border-top: 2px solid #b8860b;
        }

        .table-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            border: 1px solid #d5dce5;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 12px #00000010;
        }

        .table-caption {
            padding: 12px;
            color: #173b70;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            caption-side: top;
        }
    </style>
</head>

<body class="page-body">

    <div class="table-container">

        <table class="student-table">
            <caption class="table-caption">Student Marks Table</caption>

            <thead class="table-head">
                <tr class="table-row">
                    <th class="table-heading">Name</th>
                    <th class="table-heading">Course</th>
                    <th class="table-heading">Marks</th>
                </tr>
            </thead>

            <tbody class="table-body">
                <tr class="table-row">
                    <td class="table-data">Rahul</td>
                    <td class="table-data">Engineering</td>
                    <td class="table-data">85</td>
                </tr>

                <tr class="table-row">
                    <td class="table-data">Amit</td>
                    <td class="table-data">Computer Science</td>
                    <td class="table-data">92</td>
                </tr>

                <tr class="table-row">
                    <td class="table-data">Priya</td>
                    <td class="table-data">Electronics</td>
                    <td class="table-data">88</td>
                </tr>
            </tbody>

            <tfoot class="table-foot">
                <tr class="table-row">
                    <td class="table-data" colspan="2">Total Students: 3</td>
                    <td class="table-data">265</td>
                </tr>
            </tfoot>
        </table>

    </div>

</body>
</html>
