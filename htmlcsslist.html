
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML List Tags</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #eef2f7;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }

        ul {
            width: 80%;
            min-width: 250px;
            max-width: 700px;
            margin: 25px auto;
            padding: 20px 20px 20px 45px;

            background-color: #e3f2fd;
            color: #173b70;

            list-style-type: square;
            list-style-position: outside;
            list-style-image: none;

            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: normal;
            font-style: normal;

            text-align: left;
            text-decoration: none;
            text-transform: none;
            text-indent: 0;

            letter-spacing: 0.5px;
            word-spacing: 2px;
            line-height: 2;

            border: 2px solid #1976d2;
            border-radius: 12px;

            box-shadow: 0 5px 15px #00000020;
            opacity: 1;
        }

        ol {
            width: 80%;
            min-width: 250px;
            max-width: 700px;
            margin: 25px auto;
            padding: 20px 20px 20px 50px;

            background-color: #fff3e0;
            color: #8d4b00;

            list-style-type: decimal;
            list-style-position: outside;
            list-style-image: none;

            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: normal;
            font-style: normal;

            text-align: left;
            text-decoration: none;
            text-transform: none;
            text-indent: 0;

            letter-spacing: 0.5px;
            word-spacing: 2px;
            line-height: 2;

            border: 2px solid #ef6c00;
            border-radius: 12px;

            box-shadow: 0 5px 15px #00000020;
            opacity: 1;
        }

        li {
            margin: 8px 0;
            padding: 8px 12px;

            background-color: #ffffff;
            color: #333333;

            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: normal;
            font-style: normal;

            text-align: left;
            text-decoration: none;
            text-transform: none;
            text-indent: 0;

            letter-spacing: 0.3px;
            word-spacing: 1px;
            line-height: 1.7;

            border: 1px solid #d0d7de;
            border-radius: 6px;

            list-style-type: inherit;
            list-style-position: inherit;

            overflow-wrap: break-word;
            word-break: normal;

            opacity: 1;
            cursor: default;

            transition: background-color 0.3s ease,
                        color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        ul li {
            border-left: 4px solid #1976d2;
        }

        ol li {
            border-left: 4px solid #ef6c00;
        }

        li:hover {
            background-color: #dcedc8;
            color: #245b16;
            box-shadow: 0 3px 8px #00000015;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>HTML Unordered List</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <h1>HTML Ordered List</h1>

    <ol>
        <li>Open Visual Studio Code</li>
        <li>Create an HTML file</li>
        <li>Write the HTML code</li>
        <li>Save and run the file</li>
    </ol>

</body>
</html>
