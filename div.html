<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker Submission</title>
</head>

<body>

    <div style="width: 70%; margin: 0 auto; background-color: #E9ECEF; padding: 20px;">

        <header
            style="background-color: white; border: 1px solid #D5D5D5; padding: 20px; text-align: center; margin-bottom: 20px;">
            <h1 style="color: #555; margin: 0;">
                Speaker Submission
            </h1>

            <p style="color: #777; margin-bottom: 0;">
                Want to speak at our fake conference?<br>
                Fill out this form.
            </p>
        </header>

        <main style="background-color: white; border: 1px solid #D5D5D5; padding:20px;">

            <div style="display: flex; margin-bottom: 20px;">

                <div style="width: 25%;">
                    Name
                </div>

                <div style="width: 60%;">
                    <input type="text" style="width: 100%; box-sizing: border-box;">
                </div>

            </div>

            <div style="display: flex; margin-bottom: 20px;">

                <div style="width: 25%;">
                    Email
                </div>

                <div style="width: 60%;">
                    <input type="email" placeholder="you@example.com" style="width: 100%; box-sizing: border-box;">
                </div>

            </div>

            <div style="display: flex; margin-bottom: 20px;">

                <div style="width: 25%;">
                    Type of Talk
                </div>

                <div style="width: 60%;">

                    <label>
                        <input type="radio" name="talk">
                        Main Stage
                    </label>

                    <label style="margin-left: 15px;">
                        <input type="radio" name="talk">
                        Workshop
                    </label>

                </div>

            </div>

            <div style="display: flex; margin-bottom: 20px;">

                <div style="width: 25%;">
                    T-Shirt Size
                </div>

                <div style="width: 60%;">

                    <select style="width: 100%; padding: 8px;">

                        <option>Extra Small</option>
                        <option>Small</option>
                        <option>Medium</option>
                        <option>Large</option>
                        <option>Extra Large</option>

                    </select>

                </div>

            </div>

            <div style="display: flex; margin-bottom: 20px;">

                <div style="width: 25%;">
                    Abstract
                </div>

                <div style="width: 60%;">

                    <textarea style="width: 100%; height: 100px; box-sizing: border-box;">
                    </textarea>

                    <div style="font-size: 12px; color: #999;">
                        Describe your talk in 500 words or less
                    </div>

                </div>

            </div>

            <div style="margin-left: 25%; margin-bottom: 20px;">

                <input type="checkbox" id="availability">
                <label for="availability">
                    I'm actually available the date of the talk
                </label>

            </div>

            <div style="margin-left: 25%;">

                <button type="submit" style="background-color: #4F91D9;
                           color: white;
                           border: none;
                           padding: 10px 35px;
                           border-radius: 3px;">

                    Submit

                </button>

            </div>

        </main>

    </div>

</body>

</html>
