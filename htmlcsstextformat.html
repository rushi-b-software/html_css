
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Text Formatting Tags</title>

    <style>
        .heading1 {
            color: red;
            background-color: lightyellow;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 40px;
            font-weight: bold;
            font-style: normal;
            font-variant: normal;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            text-indent: 0;
            text-shadow: 2px 2px 3px gray;
            letter-spacing: 2px;
            word-spacing: 5px;
            line-height: 1.5;
            width: 80%;
            min-width: 300px;
            max-width: 900px;
            height: auto;
            margin: 20px auto;
            padding: 15px;
            border: 3px solid red;
            border-radius: 10px;
            box-sizing: border-box;
            opacity: 1;
        }
        .heading2 {
            color: blue;
            background-color: lightblue;
            font-family: Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            font-style: italic;
            text-align: left;
            text-decoration: underline;
            text-transform: capitalize;
            text-shadow: 1px 1px 2px gray;
            letter-spacing: 1px;
            word-spacing: 4px;
            line-height: 1.4;
            margin: 18px 0;
            padding: 12px;
            border: 2px solid blue;
            border-radius: 8px;
            width: 70%;
            box-sizing: border-box;
        }
        .heading3 {
            color: green;
            background-color: lightgreen;
            font-family: Verdana, sans-serif;
            font-size: 26px;
            font-weight: 600;
            font-style: normal;
            text-align: right;
            text-decoration: overline;
            text-transform: capitalize;
            letter-spacing: 2px;
            word-spacing: 3px;
            line-height: 1.3;
            margin: 15px 0;
            padding: 10px;
            border: 2px dashed green;
            border-radius: 6px;
            width: 60%;
            box-sizing: border-box;
        }
        .heading4 {
            color: purple;
            background-color: lavender;
            font-family: "Trebuchet MS", sans-serif;
            font-size: 22px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            text-decoration: line-through;
            text-transform: uppercase;
            letter-spacing: 1px;
            word-spacing: 3px;
            line-height: 1.3;
            margin: 12px 0;
            padding: 8px;
            border: 2px dotted purple;
            border-radius: 5px;
            width: 50%;
            box-sizing: border-box;
        }

        .heading5 {
            color: brown;
            background-color: beige;
            font-family: "Courier New", monospace;
            font-size: 19px;
            font-weight: 500;
            font-style: normal;
            text-align: left;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 2px;
            word-spacing: 4px;
            line-height: 1.5;
            margin: 10px 0;
            padding: 7px;
            border: 1px solid brown;
            border-radius: 4px;
            width: 45%;
            box-sizing: border-box;
        }

        .heading6 {
            color: darkorange;
            background-color: moccasin;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 400;
            font-style: italic;
            text-align: center;
            text-decoration: underline;
            text-transform: capitalize;
            letter-spacing: 1px;
            word-spacing: 2px;
            line-height: 1.4;
            margin: 8px 0;
            padding: 6px;
            border: 1px solid darkorange;
            border-radius: 3px;
            width: 40%;
            box-sizing: border-box;
        }

        .paragraph {
            color: #333333;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: normal;
            font-style: normal;
            text-align: justify;
            text-decoration: none;
            text-transform: none;
            text-indent: 30px;
            letter-spacing: 0.5px;
            word-spacing: 3px;
            line-height: 1.8;
            width: 90%;
            max-width: 1000px;
            margin: 15px auto;
            padding: 15px;
            border: 1px solid gray;
            border-radius: 8px;
            box-sizing: border-box;
            white-space: normal;
            overflow-wrap: break-word;
            word-break: normal;
        }

        .line-break {
            line-height: 2;
        }

        .horizontal-line {
            width: 80%;
            height: 3px;
            background-color: black;
            border: none;
            border-radius: 5px;
            margin: 25px auto;
        }

        .bold-text {
            color: red;
            background-color: yellow;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: 900;
            font-style: normal;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 1px;
            word-spacing: 2px;
            padding: 2px 5px;
            border: 1px solid red;
            border-radius: 3px;
        }

        .italic-text {
            color: blue;
            background-color: lightcyan;
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: normal;
            font-style: italic;
            text-decoration: underline;
            text-transform: capitalize;
            letter-spacing: 1px;
            word-spacing: 2px;
            padding: 2px 5px;
            border: 1px solid blue;
            border-radius: 3px;
        }

        .strong-text {
            color: darkgreen;
            background-color: lightgreen;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: 900;
            font-style: normal;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 1px;
            word-spacing: 2px;
            padding: 3px 6px;
            border: 2px solid darkgreen;
            border-radius: 4px;
        }

        .teletype-text {
            color: darkmagenta;
            background-color: #eeeeee;
            font-family: "Courier New", monospace;
            font-size: 18px;
            font-weight: normal;
            font-style: normal;
            text-decoration: none;
            text-transform: lowercase;
            letter-spacing: 1px;
            word-spacing: 3px;
            padding: 3px 6px;
            border: 1px solid darkmagenta;
            border-radius: 3px;
        }

        .code-text {
            color: white;
            background-color: #222222;
            font-family: "Courier New", monospace;
            font-size: 17px;
            font-weight: bold;
            font-style: normal;
            text-align: left;
            text-decoration: none;
            text-transform: none;
            letter-spacing: 1px;
            word-spacing: 2px;
            line-height: 1.5;
            padding: 4px 8px;
            border: 1px solid black;
            border-radius: 4px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }

        .emphasized-text {
            color: darkorange;
            background-color: lightyellow;
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: bold;
            font-style: italic;
            text-decoration: underline;
            text-transform: capitalize;
            letter-spacing: 1px;
            word-spacing: 2px;
            padding: 3px 6px;
            border: 1px solid darkorange;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h1 class="heading1">Heading 1</h1>
    <h2 class="heading2">Heading 2</h2>
    <h3 class="heading3">Heading 3</h3>
    <h4 class="heading4">Heading 4</h4>
    <h5 class="heading5">Heading 5</h5>
    <h6 class="heading6">Heading 6</h6>

    <hr class="horizontal-line">

    <p class="paragraph">
        This is a paragraph.
        <br class="line-break">
        This is the second line of the paragraph.
        <br class="line-break">
        This is the third line.
    </p>

    <p class="paragraph">
        This is <b class="bold-text">Bold Text</b>.
        This is <i class="italic-text">Italic Text</i>.
        This is <strong class="strong-text">Strong Text</strong>.
        This is <tt class="teletype-text">Teletype Text</tt>.
        This is <code class="code-text">Code Text</code>.
        This is <em class="emphasized-text">Emphasized Text</em>.
    </p>

</body>
</html>
