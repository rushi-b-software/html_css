<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>

<body style="background: linear-gradient(to right, #6da8d6, #9b5bc0);">

    <div style="width: 80%; margin:70px auto; background-color: white; justify-content: center; padding:30px;border-radius: 8px;">

        <h1>Registration</h1>

        <div style="display: flex;">
            <div style="width: 45%;">
                <label for="fullname" style="display: block;">Full Name</label>
                <input id="fullname" type="text" placeholder="Enter your name">
            </div>

            <div style="width: 45%;">
                <label for="username" style="display: block;">Username</label>
                <input id="username" type="text" placeholder="Enter your username">
            </div>
        </div>

        <div style="display: flex;">
            <div style="width: 45%;">
                <label for="email" style="display: block;">Email</label>
                <input id="email" type="email" placeholder="Enter your email">
            </div>

            <div style="width: 45%;">
                <label for="Phonenumber" style="display: block;">Phone Number</label>
                <input id="Phonenumber" type="text" placeholder="Enter your number">
            </div>
        </div>

        <div style="display: flex;">
            <div style="width: 45%;">
                <label for="password" style="display: block;">Password</label>
                <input id="password" type="password" placeholder="Enter your password">
            </div>

            <div style="width: 45%;">
                <label for="ConfirmPassword" style="display: block;"> Confirm Password</label>
                <input id="ConfirmPassword" type="password" placeholder="Confirm your password">
            </div>
        </div>

        <div>
            <label>Gender</label>

            <div style="display: flex;">
                <div>
                    <input type="radio" name="gender">
                    <label>Male</label>
                </div>

                <div>
                    <input type="radio" name="gender">
                    <label>Female</label>
                </div>

                <div>
                    <input type="radio" name="gender">
                    <label>Prefer not to say</label>
                </div>
            </div>
        </div>

        <div>
            <button style="display: block;margin: auto;">Register</button>
        </div>

    </div>

</body>
</html>
