<!DOCTYPE html>
<html>
<head>
<style>

.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.container div {
  background-color: lightblue;
  padding: 30px;
  text-align: center;
}

</style>
</head>
<body>

<div class="container">
  <div>Box 1</div>
  <div>Box 2</div>
  <div>Box 3</div>
  <div>Box 4</div>
  <div>Box 5</div>
  <div>Box 6</div>
</div>

</body>
</html>
